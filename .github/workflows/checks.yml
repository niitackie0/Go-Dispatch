# Typecheck and build, on every pull request and every push to a shared branch.
#
# WHY THIS EXISTS. `main` deploys itself the moment anything lands on it, and
# until now the only thing standing between a broken merge and production was
# somebody remembering to run `npm run lint` first. render.yaml says so out
# loud: "let the build be the gate". An honour system is not a gate, and the
# six open Dependabot pull requests -- typescript 5 to 7, vite 6 to 8,
# @types/node 22 to 26, express -- are exactly the kind of change that honour
# systems lose to.
#
# WHAT IT ACTUALLY PROVES. `npm run build` is the same command Render runs, so
# a green check here means the deploy will at least compile. It runs the real
# thing rather than an approximation: prisma generate, then vite build, then
# esbuild of the server bundle.
#
# WHAT IT DOES NOT PROVE. There are no tests in this repository, so nothing
# here says the app behaves correctly -- only that it type-checks and builds.
# Worth knowing when a dependency bump goes green: that is a compile, not a
# verdict. The things with no automated cover at all are the state machine, the
# pricing arithmetic and the SMS templates.
#
# NO SECRETS. `prisma generate` needs DIRECT_URL to exist because
# prisma.config.ts reads it, but it never connects -- so a fake URL satisfies
# it and no real credential comes near a pull request from a fork.
#
# TO MAKE IT BLOCK MERGES rather than merely report, add a ruleset:
# Settings -> Rules -> Rulesets -> New branch ruleset, targeting `main` and
# `staging`, with "Require status checks to pass" -> `build`. Without that this
# is advice; with it, it is the gate render.yaml already assumes exists.

name: Checks

on:
  pull_request:
    branches: [dev, staging, main]
  push:
    branches: [dev, staging, main]

# Nothing here writes to the repository.
permissions:
  contents: read

# A second push to the same branch makes the first one irrelevant. Cancel it
# rather than paying for both and reading the stale one.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # Parseable and unreachable, both deliberately. prisma generate reads the
      # URL out of prisma.config.ts and validates its shape; it opens no
      # connection, so this never needs to be real.
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?sslmode=disable

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # package.json pins >=22 <23. Matching it here means a version that
          # would fail on Render fails here first.
          node-version: '22'
          cache: npm

      # npm ci, not npm install: it installs the lockfile exactly, which is
      # what Render does. An install that quietly resolves something different
      # is not the build being checked.
      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run lint

      # The same command as render.yaml's buildCommand, minus `npm run release`
      # -- migrations need a real database and belong to the deploy, not here.
      - name: Build
        run: npm run build

      # Cheap, and it covers the one thing a typecheck cannot see: whether a
      # message still fits a single billed segment. The script prints every
      # variant with its cost, so a template that grew shows up in the log of
      # the pull request that grew it.
      - name: Render every SMS template
        run: npm run sms:preview
