# Nightly backup of the GO DISPATCH database.
#
# Runs on GitHub Actions rather than on Render, because the Render instance is
# a free one that sleeps -- a cron inside a process that is not running is not
# a cron. Actions also fails loudly, by email, which a silent backup job never
# does. A silently failing backup is the classic: you find out the night you
# need it.
#
# IT DOES NOT ONLY TAKE THE DUMP. It restores it into a throwaway Postgres and
# counts the rows before keeping it. "We have backups" and "we have backups
# that restore" are different claims, and only the second one is worth
# anything. This makes the second one true every night instead of once, on the
# day somebody remembered to check.
#
# ---------------------------------------------------------------------------
# SETUP — two repository secrets, Settings -> Secrets and variables -> Actions
# ---------------------------------------------------------------------------
#
#   DIRECT_URL          The Neon connection string WITHOUT `-pooler` in the
#                       host. pg_dump holds one long transaction; a connection
#                       pooler is the wrong end to hold it against.
#
#   BACKUP_PASSPHRASE   Anything long and random. The dump holds every
#                       customer's name, phone number and home address, so it
#                       is encrypted before it is stored.
#
#                       KEEP THIS SOMEWHERE THAT IS NOT GITHUB. A passphrase
#                       stored only in the same account as the backups protects
#                       nothing, and a lost one makes every backup a file of
#                       noise. A password manager. Written down. Both.
#
# Restoring: docs/backups.md.

name: Nightly backup

on:
  schedule:
    # 02:00 UTC. Ghana is UTC+0 year round, so this is 2am locally -- the
    # quietest hour, and hours before anyone opens the console.
    - cron: '0 2 * * *'
  # So you can prove it works today rather than waiting until tomorrow.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The throwaway the dump gets restored into. Must match the version Neon
    # runs, or the restore proves nothing about the database we actually have.
    services:
      verify:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: verify
          POSTGRES_DB: verify
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Install postgresql-client 18
        # The runner ships an older client, and pg_dump refuses to dump a
        # server newer than itself. Pinned to the major version Neon runs.
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
            https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-18
          pg_dump --version

      - name: Take the dump
        env:
          DIRECT_URL: ${{ secrets.DIRECT_URL }}
        run: |
          if [ -z "$DIRECT_URL" ]; then
            echo "::error::DIRECT_URL secret is not set. See the header of this file."
            exit 1
          fi

          # A secret is stored exactly as pasted, trailing newline and all, and
          # copying the DIRECT_URL line out of .env brings one along. It lands
          # inside the value of whichever parameter comes last in the string --
          # "invalid channel_binding value: require\n" -- which reads like a
          # misconfigured connection rather than a stray keystroke. Cost 31
          # nightly runs before anyone read the error closely.
          # A URL cannot legitimately contain a line break, so drop them, and
          # the surrounding quotes that the .env line also carries.
          DIRECT_URL="$(printf '%s' "$DIRECT_URL" | tr -d '\r\n')"
          DIRECT_URL="${DIRECT_URL%\"}"
          DIRECT_URL="${DIRECT_URL#\"}"

          # sslmode=verify-full means "check the certificate against a CA", and
          # libpq looks for that CA at ~/.postgresql/root.crt. A fresh runner
          # has no such file, so the connection fails before it is attempted:
          # root certificate file ".../root.crt" does not exist.
          # sslrootcert=system points libpq at Ubuntu's own trust store, which
          # the runner image already maintains and which Neon's certificate
          # chains to. Needs libpq 16+; the step above installs 18.
          # Verification stays ON. The failure was a missing trust store, not a
          # certificate worth trusting blindly -- downgrading to sslmode=require
          # would have turned a loud error into an unauthenticated connection.
          case "$DIRECT_URL" in
            *sslrootcert=*) ;;
            *\?*) DIRECT_URL="$DIRECT_URL&sslrootcert=system" ;;
            *)     DIRECT_URL="$DIRECT_URL?sslrootcert=system" ;;
          esac

          # --no-owner and --no-privileges so it restores into any role, which
          # is the whole point on a day when the original role is what broke.
          pg_dump "$DIRECT_URL" \
            --no-owner \
            --no-privileges \
            --format=plain \
            --file=backup.sql
          echo "dump: $(du -h backup.sql | cut -f1), $(wc -l < backup.sql) lines"

      - name: Restore it into a throwaway, and count what came back
        env:
          PGPASSWORD: verify
        run: |
          psql -h localhost -U postgres -d verify -v ON_ERROR_STOP=1 -q -f backup.sql

          # A dump that restores without error can still be empty. Assert the
          # tables that would end the business if they were lost.
          read -r orders payments admins <<< "$(psql -h localhost -U postgres -d verify -tAX -F' ' -c \
            "SELECT (SELECT count(*) FROM orders),
                    (SELECT count(*) FROM payments),
                    (SELECT count(*) FROM admin_users);")"

          echo "restored: $orders order(s), $payments payment(s), $admins admin account(s)"

          if [ "$admins" -lt 1 ]; then
            echo "::error::Restored database has no admin accounts. This backup would not get anyone back in."
            exit 1
          fi

          # Orders can legitimately be zero before launch, so it is a warning
          # rather than a failure -- but a silent zero is how you discover in
          # six months that you have been dumping an empty schema.
          if [ "$orders" -lt 1 ]; then
            echo "::warning::Restored database has no orders. Fine before launch, alarming after it."
          fi

      - name: Encrypt
        env:
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: |
          if [ -z "$BACKUP_PASSPHRASE" ]; then
            echo "::error::BACKUP_PASSPHRASE secret is not set. See the header of this file."
            exit 1
          fi

          # Same trailing-newline trap as DIRECT_URL, but this one fails
          # silently: openssl encrypts happily with a passphrase ending in a
          # newline, and the artifact then rejects every passphrase a human
          # types back on the day they need it. Strip it here so what is
          # written in the password manager is what opens the file.
          BACKUP_PASSPHRASE="$(printf '%s' "$BACKUP_PASSPHRASE" | tr -d '\r\n')"
          export BACKUP_PASSPHRASE
          gzip -9 backup.sql
          # -pbkdf2 because the old default KDF is one round of MD5.
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt \
            -in backup.sql.gz \
            -out "go-dispatch-$(date -u +%Y-%m-%d).sql.gz.enc" \
            -pass env:BACKUP_PASSPHRASE
          rm -f backup.sql.gz
          ls -lh *.enc

      - name: Keep it
        uses: actions/upload-artifact@v4
        with:
          name: backup-${{ github.run_id }}
          path: '*.sql.gz.enc'
          # The GitHub maximum. Worth knowing what this is and is not: it is
          # off-Neon, which is the risk it was built for, but it is not
          # off-GitHub and it is not permanent. Before it matters, move the
          # monthly one somewhere you own -- docs/backups.md says how.
          retention-days: 90
          if-no-files-found: error
