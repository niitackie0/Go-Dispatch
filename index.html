<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The bar's mark, inline: one fewer request, and it stops the
         /favicon.ico 404 that fired on every page load. -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%23D81E24'/><path d='M7 9.5 12.5 16 7 22.5M15.5 9.5 21 16l-5.5 6.5' fill='none' stroke='%23fff' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/></svg>" />
    <meta name="theme-color" content="#D81E24" />
    <title>GO DISPATCH — Nationwide Parcel Delivery from Accra</title>

    <!-- ============================================================
         The opening.

         Inline on purpose. This has to be on screen before a byte of
         the bundle has arrived, so it cannot live in index.css — that
         file only exists once the thing it is covering for has loaded.
         The ground is the home page's own hero — slate-950 under the
         same two red glows, copied from Home.tsx — so the hand-off is a
         fade between two identical fields rather than a flash. It was
         --wp-bg first, which meant the screen went from off-white to
         near-black the instant React painted.

         src/main.tsx takes it down on first paint. If that never
         happens — scripts blocked, a bundle that throws — the failsafe
         animation clears it after ten seconds rather than leaving a red
         chevron sitting over a page nobody can reach.
         ============================================================ -->
    <style>
      #gd-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background:
          radial-gradient(58% 62% at 72% 26%, rgba(216, 30, 36, 0.55), transparent 62%),
          radial-gradient(48% 55% at 18% 82%, rgba(122, 15, 19, 0.55), transparent 66%),
          #020617;
        transition: opacity 240ms ease, transform 240ms cubic-bezier(0.16, 1, 0.3, 1);
        animation: gd-failsafe 1ms linear 10s forwards;
      }
      #gd-splash.gd-done {
        opacity: 0;
        transform: scale(1.06);
        pointer-events: none;
      }
      @keyframes gd-failsafe { to { opacity: 0; visibility: hidden; } }

      /* Each chevron draws itself, the second a beat behind the first. 26 is
         a little over the path length, so the stroke starts fully hidden. */
      #gd-splash svg { filter: drop-shadow(0 0 22px rgba(216, 30, 36, 0.55)); }
      #gd-splash path {
        stroke-dasharray: 26;
        stroke-dashoffset: 26;
        animation: gd-draw 400ms cubic-bezier(0.4, 0, 0.2, 1) forwards;
      }
      #gd-splash path:nth-child(2) { animation-delay: 90ms; }
      @keyframes gd-draw { to { stroke-dashoffset: 0; } }

      /* Inter is still downloading at this point on a first visit, so this is
         set in the same fallback stack the app declares — the swap, if it
         lands in time, is between two faces of the same width. */
      #gd-splash .gd-word {
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        font-size: 11px;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        line-height: 1;
        color: #FFFFFF;
        opacity: 0;
        animation: gd-rise 420ms 150ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
      }
      #gd-splash .gd-word b { font-weight: 600; }
      @keyframes gd-rise {
        from { opacity: 0; transform: translateY(7px); }
        to   { opacity: 1; transform: none; }
      }

      @media (prefers-reduced-motion: reduce) {
        #gd-splash { transition-duration: 1ms; }
        #gd-splash path { animation: none; stroke-dashoffset: 0; }
        #gd-splash .gd-word { animation: none; opacity: 1; }
      }
    </style>
  </head>
  <body>
    <!-- Removed by src/main.tsx. Hidden from assistive technology: it says
         nothing the page underneath will not say a moment later. -->
    <div id="gd-splash" aria-hidden="true">
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#E8262C" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4.5 5.5 11 12l-6.5 6.5" />
        <path d="M13 5.5 19.5 12 13 18.5" />
      </svg>
      <span class="gd-word"><b>Go</b> Dispatch</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
